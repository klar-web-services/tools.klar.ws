<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>@TOOL@ · retired</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 3rem 1.5rem; background: #10131a; color: #d7dbe4;

      h1 { font-size: 1.4rem; margin: 0 0 .35rem; color: #fff; }
      p { color: #98a0b0; margin: 0 0 1.5rem; }
      .notice { white-space: pre-line; background: #171b24; border: 1px solid #3a3420;
                border-radius: 8px; padding: .9rem 1.1rem; color: #e6d7a3; }

  <body>
    <main>
      <h1>@TOOL@ has been retired</h1>

      <div class="notice">
@BLOCK@
      </div>
    </main>
