# Read-only proxy in front of the release bucket.
# S3_ORIGIN: the bucket URL, e.g. https://<bucket>.<s3-endpoint-host>
services:
  proxy:
    image: nginx:1.31.8-alpine-slim@sha256:9c68ad4f28e7dee4b9484a7859bf451da39ef661bcd038ef62e87593fcd91c86
    restart: unless-stopped
    environment:
      S3_ORIGIN: ${S3_ORIGIN:?set S3_ORIGIN to the bucket URL}
      S3_CACHE_VALID: ${S3_CACHE_VALID:-1m}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "^(S3_|NGINX_LOCAL_RESOLVERS$$)"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx/tools:size=256m
    # The reverse proxy only routes to healthy containers, so check early
    # after start (start_interval) to keep redeploys to a few seconds.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
