# Deployed by Dokploy (compose service "tools", project tools.klar.ws).
# Set S3_ORIGIN in Dokploy's Environment tab, e.g.
#   S3_ORIGIN=https://<bucket>.fsn1.your-objectstorage.com
# Domain: tools.klar.ws, path /, service "proxy", port 80.
services:
  proxy:
    image: nginx:1.31.7-alpine-slim@sha256:ebd058041a732a2b2dc0b606e34572dd8e0034de6a4aa4d50d8c13a240ac6005
    restart: unless-stopped
    environment:
      S3_ORIGIN: ${S3_ORIGIN:?set S3_ORIGIN to the bucket URL}
      S3_CACHE_VALID: ${S3_CACHE_VALID:-1m}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "^(S3_|NGINX_LOCAL_RESOLVERS$$)"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx/tools:size=256m
    # Traefik only routes to a container once it is healthy, so check early
    # after start (start_interval) to keep redeploys to a few seconds.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
