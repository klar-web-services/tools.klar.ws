name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck bin/toolsctl test/e2e.sh
      - name: End-to-end test (local S3 + nginx)
        run: test/e2e.sh
