name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck bin/toolsctl test/e2e.sh nginx/05-tools-proxy.sh
      - name: End-to-end test (local S3 + nginx)
        run: test/e2e.sh

  # Runs publish/action.yml exactly as tool repositories call it, against the
  # local S3 stand-in, then installs through the proxy.
  action:
    runs-on: ubuntu-latest
    env:
      TOOLS_S3_ENDPOINT: http://127.0.0.1:39000
      TOOLS_S3_REGION: us-east-1
      TOOLS_PUBLIC_URL: http://127.0.0.1:38080
      AWS_ACCESS_KEY_ID: e2e-access
      AWS_SECRET_ACCESS_KEY: e2e-secret-key
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - name: Start local S3 and proxy
        run: |
          docker compose -f test/compose.yml up -d --quiet-pull --build s3 proxy
          for _ in $(seq 60); do
            aws --endpoint-url "$TOOLS_S3_ENDPOINT" s3api list-buckets >/dev/null 2>&1 && break
            sleep 1
          done
          aws --endpoint-url "$TOOLS_S3_ENDPOINT" s3api create-bucket --bucket tools-test
          TOOLS_S3_BUCKET=tools-test bin/toolsctl apply-policy
      - name: Build a fake release
        run: |
          mkdir -p build dist
          printf '#!/bin/sh\necho "demo 1.0.0"\n' > build/demo
          chmod +x build/demo
          tar -czf dist/demo-x86_64-unknown-linux-gnu.tar.gz -C build demo
          (cd dist && sha256sum -- * > checksums.txt)
      - name: Publish through the action
        uses: ./publish
        with:
          tool: demo
          version: v1.0.0
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          description: Published by the action test
          bucket: tools-test
          access-key-id: e2e-access
          secret-access-key: e2e-secret-key
      - name: Install from the proxy
        run: |
          for _ in $(seq 30); do curl -fs -o /dev/null "$TOOLS_PUBLIC_URL/healthz" && break; sleep 1; done
          test "$(curl -fsS "$TOOLS_PUBLIC_URL/demo/latest")" = "1.0.0"
          curl -fsSL "$TOOLS_PUBLIC_URL/demo/install.sh" | DEMO_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          test "$("$RUNNER_TEMP/bin/demo")" = "demo 1.0.0"
          curl -fsS "$TOOLS_PUBLIC_URL/demo/" | grep -q 'Published by the action test'
          curl -fsS "$TOOLS_PUBLIC_URL/demo/" | grep -q "href=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY\""
      - name: A glob that matches nothing fails the action
        id: nomatch
        continue-on-error: true
        uses: ./publish
        with:
          tool: demo
          version: v1.0.1
          files: dist/*.nope
          bucket: tools-test
          access-key-id: e2e-access
          secret-access-key: e2e-secret-key
      - name: Check that it failed
        run: test "${{ steps.nomatch.outcome }}" = failure

  # Ships the proxy image once everything above passed on main. Dokploy deploys
  # :latest whenever GHCR reports a new one (repository webhook, registry
  # package events), so a red run never reaches production.
  deploy:
    needs: [test, action]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push the image if the proxy changed
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The revision :latest was built from, empty before the first push.
          live=$(docker pull -q "$IMAGE:latest" >/dev/null 2>&1 &&
            docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:latest" || true)
          # Compared with what is live, not with the previous push, so a proxy
          # change from a red commit still ships with the next green one.
          if [ -n "$live" ] && git diff --quiet "$live" "$GITHUB_SHA" -- Dockerfile .dockerignore nginx/ 2>/dev/null; then
            echo "::notice::The proxy is unchanged since $live; nothing to deploy."
            exit 0
          fi
          # An older run finishing late must not roll production back.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on; its run deploys."
            exit 0
          fi
          # One plain manifest per push: no attestations, which GHCR would
          # report as untagged versions.
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-$GITHUB_SHA" .
          # :latest first: its push creates the new package version that
          # Dokploy deploys. The commit tag is for rolling back.
          docker push -q "$IMAGE:latest"
          docker push -q "$IMAGE:sha-$GITHUB_SHA"
          echo "::notice::Pushed $IMAGE:sha-$GITHUB_SHA as :latest."
