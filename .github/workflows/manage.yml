name: Manage a tool

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [status, import, set-latest, retire, purge, unretire, apply-policy]
        default: status
      tool:
        description: Tool name (empty with status lists all tools)
        type: string
        default: ""
      version:
        description: set-latest, import (the release tag, e.g. v1.2.3)
        type: string
        default: ""
      repo:
        description: import only; GitHub repository whose release to copy, e.g. klar-web-services/bbs
        type: string
        default: ""
      description:
        description: import only; one-line text for the generated landing page
        type: string
        default: ""
      message:
        description: retire only; shown to users, e.g. why and what to use instead
        type: string
        default: ""
      confirm:
        description: purge only; type the tool name again
        type: string
        default: ""

concurrency:
  group: manage-${{ inputs.tool }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ${{ inputs.command }} ${{ inputs.tool }}
        env:
          TOOLS_S3_BUCKET: ${{ secrets.TOOLS_S3_BUCKET }}
          TOOLS_S3_ACCESS_KEY: ${{ secrets.TOOLS_S3_ACCESS_KEY }}
          TOOLS_S3_SECRET_KEY: ${{ secrets.TOOLS_S3_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.command }}
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ inputs.repo }}
          DESCRIPTION: ${{ inputs.description }}
          MESSAGE: ${{ inputs.message }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          tool_args=()
          if [ -n "$TOOL" ]; then tool_args=(--tool "$TOOL"); fi
          case "$COMMAND" in
            status | unretire) bin/toolsctl "$COMMAND" "${tool_args[@]}" ;;
            apply-policy) bin/toolsctl apply-policy ;;
            set-latest) bin/toolsctl set-latest "${tool_args[@]}" --version "$VERSION" ;;
            retire) bin/toolsctl retire "${tool_args[@]}" --message "$MESSAGE" ;;
            purge)
              if [ "$CONFIRM" != "$TOOL" ]; then
                echo "::error::confirm must repeat the tool name to purge"
                exit 1
              fi
              bin/toolsctl purge "${tool_args[@]}" --yes ;;
            import)
              # Copy an existing GitHub release; installers are generated from templates/.
              if [ -z "$REPO" ] || [ -z "$VERSION" ]; then
                echo "::error::import needs repo and version"
                exit 1
              fi
              dir=$(mktemp -d)
              gh release download "$VERSION" --repo "$REPO" --dir "$dir"
              bin/toolsctl publish "${tool_args[@]}" --version "$VERSION" \
                --repo-url "https://github.com/$REPO" --description "$DESCRIPTION" -- "$dir"/* ;;
          esac
          if [ "$COMMAND" != status ]; then bin/toolsctl status "${tool_args[@]}"; fi
